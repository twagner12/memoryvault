[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryvault"
version = "0.1.0"
description = "Get all your photos, videos, and files into one deduplicated collection."
requires-python = ">=3.10"
dependencies = [
    "blake3",
    "libarchive-c",
    "click",
    "piexif",
    "flask>=3.0",
    "Pillow>=10.0",
    # Teaches Pillow to open HEIC/HEIF. piexif cannot reach their EXIF at all,
    # so without this the Make, Model and DateTimeOriginal of every iPhone
    # photo are unreadable — 18,676 files in the current vault, 18.8% of it.
    "pillow-heif>=1.0",
    # Maps GPS coordinates to an IANA zone so a Takeout UTC timestamp can be
    # written as the local wall-clock time EXIF actually expects (#9).
    "timezonefinder",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
memoryvault = "memoryvault.cli:cli"

[tool.setuptools.packages.find]
include = ["memoryvault*"]
