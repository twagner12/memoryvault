[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryvault"
version = "0.1.0"
description = "Get all your photos, videos, and files into one deduplicated collection."
requires-python = ">=3.10"
dependencies = [
    "blake3",
    "libarchive-c",
    "click",
    "piexif",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "Pillow",
]

[project.scripts]
memoryvault = "memoryvault.cli:cli"

[tool.setuptools.packages.find]
include = ["memoryvault*"]
